name: Deploy site
on:
  push:
    branches: [main, master]
    paths: ["site/**", ".github/workflows/deploy.yml", "bin/check_portfolio.py"]
  pull_request:
    branches: [main, master]
    paths: ["site/**", ".github/workflows/deploy.yml", "bin/check_portfolio.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install official template dependencies
        run: npm ci --no-audit --no-fund
      - name: Build official Magic Portfolio
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Verify routes, content and media
        run: python3 scripts/check_export.py --directory out
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site/out
          clean: true
